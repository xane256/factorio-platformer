[tips-and-tricks-item-description]
space-hub-chest-intro=When you place down a [entity=hub-chest] on a space platform, a link between the chest and platform hub is established. Items inserted into the chest will be teleported into the inventory of the hub. Only items that can be built on the platform can be inserted into the chest and teleported, while raw and intermediate products can't be inserted.\nIn the simulation above, it is shown that items like [entity=solar-panel] can be inserted while [item=copper-plate] cannot. There are a few exceptions to the rule: all kinds of modules like [item=speed-module] and [item=repair-pack] can be inserted as they have a direct use on the platform as well. Note that ammunition and science are considered intermediate products, and can therefore not be inserted.

space-hub-chest-circuit=When you place down a Hub Chest, an invisible connection will be established to the platform hub. This enables you to interact with the chest via [item=green-wire] as if you were connecting to the platform hub directly.

space-hub-chest-quality=In order to insert items with quality, the Hub Chest needs to be of the same quality as the item.